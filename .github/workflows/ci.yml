name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERIFY_ALLOW_UNINITIALIZED: "1"

    steps:
      - name: Checkout root
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout pinned Konnect submodule only
        run: git submodule update --init --depth 1 upstream/konnect

      - name: Verify root and gitlinks
        run: python3 scripts/verify-project.py

      - name: Install system build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler cmake

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt

      - name: Run Konnect and root gates
        run: make test

      - name: Build release binary
        run: make build

      - name: Run MCP protocol smoke
        run: make mcp-smoke
