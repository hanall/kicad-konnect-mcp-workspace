# MCP 표준 실행은 stdout을 JSON-RPC 전용으로 유지하는 stdio를 사용한다.
transport = "stdio"

# KiCad 10 설치 후 PATH에서 발견된다. 다른 위치라면 절대경로로 바꾼다.
kicad_cli = "kicad-cli"
kicad_binary = "kicad"

# 이 저장소 아래에서만 설계 파일을 관리한다.
project_dir = "/home/hanol/kicad-konnect-mcp-workspace/projects"

# 빈 값이면 KiCad가 제공하는 KICAD_API_SOCKET을 사용한다.
ipc_address = ""

# HTTP transport를 명시적으로 켜더라도 기본은 loopback이다.
http_address = "127.0.0.1:3000"
log_level = "info"
